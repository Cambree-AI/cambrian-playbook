# Terraform CI for the per-environment workload layers (issue #73).
#
# PRs touching infra/envs/** get a plan comment generated under the read-only
# github-plan role; merges to dev/staging/main apply the matching account
# under github-deploy. The branch => account mapping is enforced by the IAM
# trust policies in infra/github-oidc (deploy roles trust only their GitHub
# Environment's sub claim), not by this YAML. infra/org and infra/github-oidc
# are deliberately NOT applied here — they run laptop-only as the management
# account.
#
# Credentials are GitHub OIDC only: no AWS access keys exist anywhere in this
# repository's secrets or variables, and none may be added.

name: terraform

# api-aws/** is in the trigger paths (issue #86): Lambda code is zipped into
# the plan via archive_file, so a code-only merge deploys through the same
# plan/apply pipeline as infra changes.
on:
  pull_request:
    branches: [dev, staging, main]
    paths: ["infra/envs/**", "infra/modules/**", "api-aws/**"]
  push:
    branches: [dev, staging, main]
    paths: ["infra/envs/**", "infra/modules/**", "api-aws/**"]

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read
  pull-requests: write # plan comment

# One run per ref at a time: applies to the same env serialize instead of
# racing for the state lock.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.3" # matches .tool-versions; state is written by this minor
  # GitHub PAT for the Amplify repo connection (infra/modules/amplify) — a
  # GitHub credential, NOT an AWS one; the no-AWS-keys rule above stands.
  # Only consumed when creating the Amplify app or rotating its connection;
  # empty is fine otherwise (the module ignores drift on it).
  TF_VAR_amplify_github_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}

jobs:
  plan:
    name: plan (${{ github.base_ref == 'main' && 'prod' || github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ github.base_ref == 'main' && 'prod' || github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ github.base_ref == 'main' && vars.AWS_PLAN_ROLE_PROD || github.base_ref == 'staging' && vars.AWS_PLAN_ROLE_STAGING || vars.AWS_PLAN_ROLE_DEV }}
          aws-region: us-east-2

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Lambda bundles must exist before plan: archive_file zips api-aws/dist
      # at plan time (infra/modules/api). Contained npm project — no root deps.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Build Lambda bundles
        working-directory: api-aws
        run: npm ci && npm run build

      - name: Terraform init
        working-directory: infra/envs/${{ env.TF_ENV }}
        run: terraform init -input=false -no-color

      # Plain exit codes: 0 = clean plan (with or without changes), 1 = error.
      # The job must fail on error; "changes present" is informational.
      - name: Terraform plan
        working-directory: infra/envs/${{ env.TF_ENV }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            const marker = `<!-- terraform-plan: ${env} -->`;
            let plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            const limit = 60000; // stay under the comment size cap
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... (truncated; full plan in the workflow log)';
            }
            const body = [
              marker,
              `### Terraform plan — \`infra/envs/${env}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    # Static name: expressions in a skipped job's name render unevaluated in
    # the PR checks list. The target env shows in the run's environment badge.
    name: apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Binding to the GitHub Environment is what makes the deploy role
    # assumable (its trust policy matches sub=repo:...:environment:<name>)
    # and is what enforces production's required-reviewer approval.
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_DEPLOY_ROLE_PROD || github.ref_name == 'staging' && vars.AWS_DEPLOY_ROLE_STAGING || vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: us-east-2

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same build as the plan job: the zip hashed into the plan is the zip
      # that gets applied.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Build Lambda bundles
        working-directory: api-aws
        run: npm ci && npm run build

      - name: Terraform init
        working-directory: infra/envs/${{ env.TF_ENV }}
        run: terraform init -input=false -no-color

      # Plan and apply the saved plan file within the same job so exactly
      # what was planned is what gets applied.
      - name: Terraform plan
        working-directory: infra/envs/${{ env.TF_ENV }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/${{ env.TF_ENV }}
        run: terraform apply -input=false -no-color tfplan
